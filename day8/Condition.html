<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        //Condition - Decision : true or false

        //1. if(condition) - If Condition is True then output will be true

        // let age = 12

        // if(age>=18){
             
        //     console.log("You are an adult")

        // }

        //if- True else - false statement

        let age = 12

        if(age>=18){
            console.log("You are an adult")
        }else{
            console.log("You are Minor")
        }

       

        //Multiple Conditon else if statment

        let amount = 499.99

        if(amount>=500){
            console.log("Free Deivery")
        }
        else if(amount>=400){  //amount 400 and 499 
            console.log("Rs 30 Delivery Charges")
        }
        else if(amount>=300){  // //amount 300 and 399 
            console.log("Rs 50 Delivery Charges")
        }
        else{
            console.log("Cannot Place Order Less that 300")
        }
    </script>
</body>
