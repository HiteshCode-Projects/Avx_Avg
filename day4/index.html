<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: skyblue;
            width: 350px;
            height: 150px;
            text-align: center;

            border: 1px solid black;
            margin: 20px;
            padding: 20px;

            border-radius: 15px;
        }

        p{
            border-bottom: 2px solid red;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
      <p>Hello guys</p>
    </div>

    <div class="box">
        <p>Books</p>
    </div>
</body>
</html>
