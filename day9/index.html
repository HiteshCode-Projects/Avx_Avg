<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        //Print Number 1 to 10 using console
        //console.log(1)  - 10 time

        //GOLDEN RULE : When CONDITION TRUE LOOP STARTS WHEN CONDITION FALSE LOOP STOPS

        //for(start point; ending/condition point; ++/--){ Task  }

        //When You Know the starting point and ending point- use for loop

         //Print Number 1 to 10 using for
        for(let i=1; i <=10; i++ ){

            console.log("The Value is  " , i)
        }



        //While(condition) - When CONDITION TRUE LOOP STARTS WHEN CONDITION FALSE LOOP STOPS

        let count = 1

        while(count<=5){
              console.log("Loggin  Attempt")
              count++
        }



        //Do WHile Loop- Atleast Run The code for one time - 
         let number = 7

        do{
              console.log("Good Eve")
        }while(number<5)


    </script>
</body>
